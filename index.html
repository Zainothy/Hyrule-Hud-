<!DOCTYPE html>
<html>
<head>
	<title>Savegame Viewer &ndash; The legend of Zelda: Breath of the wild</title>
	<meta http-equiv="content-Type" content="text/html; charset=UTF-8"/>
	<meta name="description" content="A savegame viewer for The legend of Zelda: Breath of the wild for unexplored Map Locations and hidden Koroks."/>
	<meta name="keywords" content="html5, savegame, save, editor, hack, exploit, wii u, zelda, breath of the wild, botw, map, korok"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
	<link rel="shortcut icon" href="./favicon.png"/>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
	<link type="text/css" rel="stylesheet" href="./assets/css/zelda-botw.css" media="all"/>
	<link type="text/css" rel="stylesheet" href="./assets/css/hyrule-hud-theme.css" media="all"/>
	<script type="text/javascript" src="./assets/js/savegame-editor.js"></script>
	<script type="text/javascript" src="./assets/js/api-client.js"></script>
	<script type="text/javascript" src="./assets/js/zelda-botw.js"></script>
	<script type="text/javascript" src="./assets/js/map-locations.js"></script>
	<script type="text/javascript" src="./assets/js/map-enemies.js"></script>
	<script type="text/javascript" src="./assets/js/map-regions.js"></script>
	<script type="text/javascript" src="./assets/js/save-slots.js"></script>
	<!-- <script type="text/javascript" src="./zelda-botw.hashes.js"></script> -->
</head>
<body>

<div id="test-banner"></div>

<div id="save-error-banner" style="display:none">
    <span id="save-error-message"></span>
    <button id="save-error-reconfigure-btn" style="display:none">Reconfigure…</button>
    <button id="save-error-dismiss-btn">✕</button>
</div>

<!-- HEADER -->
<div id="header">
	<div id="header-top">
		<div id="header-row" class="padding-vertical">
			<button id="sidebar-toggle-btn" aria-label="Toggle sidebar" aria-expanded="false">☰</button>
			<h1>Hyrule HUD <span class="hh-tagline">— live save monitor</span></h1>
			<div class="header-buttons">
				<span id="app-version" class="app-version"></span>
			</div>
		</div>
	</div>
</div>

<div id="toolbar" class="hidden">
	<div id="map-stats-section">
		<div class="toolbar-section-title">Map Stats<span class="section-toggle-indicator"> ▾</span></div>
		<label for="span-number-koroks" data-type="korok">
			<span class="map-visibility-toggle dot-korok" data-visibility-types="korok" role="button" tabindex="0" aria-label="Korok Seeds map visibility" aria-pressed="false"></span>
			<span class="stat-label-text">Korok Seeds</span>
			<span class="stat-value"><span id="span-number-koroks"></span><span id="span-number-total-koroks">/900</span></span>
		</label>
		<details id="locations-filter-group" class="stat-collapse-group">
			<summary>
				<span class="filter-summary-main">
					<span class="map-visibility-toggle dot-location" data-visibility-types="location location-discovered" role="button" tabindex="0" aria-label="Locations map visibility" aria-pressed="false"></span>
					<span class="stat-label-text">Locations</span>
				</span>
				<span class="stat-value"><span id="span-number-locations-overview"></span>/<span id="span-number-total-locations-overview"></span></span>
			</summary>
			<label for="span-number-locations" data-type="location">
				<span class="map-visibility-toggle dot-location-unvisited" data-visibility-types="location" role="button" tabindex="0" aria-label="Unvisited locations map visibility" aria-pressed="false"></span>
				<span class="stat-label-text">Not Visited</span>
				<span class="stat-value"><span id="span-number-locations"></span>/<span id="span-number-total-locations"></span></span>
			</label>
			<label for="span-number-locations-visited" data-type="location-discovered">
				<span class="map-visibility-toggle dot-location-discovered" data-visibility-types="location-discovered" role="button" tabindex="0" aria-label="Visited locations map visibility" aria-pressed="false"></span>
				<span class="stat-label-text">Visited</span>
				<span class="stat-value"><span id="span-number-locations-visited"></span>/<span id="span-number-total-locations-visited"></span></span>
			</label>
		</details>
		<div id="shrine-filter-group" class="map-filter-group">
			<div class="filter-summary-row">
				<span class="filter-summary-main">
					<span class="map-visibility-toggle shrine-summary-icon" data-visibility-types="shrine-not-activated shrine shrine-completed" role="button" tabindex="0" aria-label="Shrines map visibility" aria-pressed="false"></span>
					<span class="stat-label-text">Shrines</span>
				</span>
				<span class="stat-value"><span id="span-number-shrines-overview"></span>/<span id="span-number-total-shrines-overview"></span></span>
			</div>
			<select id="shrine-filter-select" aria-label="Shrine map filter">
				<option value="all">All States</option>
				<option value="shrine-not-activated">Unactivated</option>
				<option value="shrine">Activated</option>
				<option value="shrine-completed">Completed</option>
			</select>
			<span class="sr-only" id="shrine-count-bank">
				<span id="span-number-shrines-not-activated"></span><span id="span-number-total-shrines-not-activated"></span>
				<span id="span-number-shrines"></span><span id="span-number-total-shrines"></span>
				<span id="span-number-shrines-completed"></span><span id="span-number-total-shrines-completed"></span>
			</span>
		</div>
		<label for="span-number-towers" data-type="tower">
			<span class="map-visibility-toggle dot-tower" data-visibility-types="tower" role="button" tabindex="0" aria-label="Towers map visibility" aria-pressed="false"></span>
			<span class="stat-label-text">Towers</span>
			<span class="stat-value"><span id="span-number-towers"></span>/<span id="span-number-total-towers"></span></span>
		</label>
		<details id="divine-beasts-filter-group" class="stat-collapse-group">
			<summary>
				<span class="filter-summary-main">
					<span class="map-visibility-toggle dot-divine-beast" data-visibility-types="divine-beast divine-beast-completed" role="button" tabindex="0" aria-label="Divine Beasts map visibility" aria-pressed="false"></span>
					<span class="stat-label-text">Divine Beasts</span>
				</span>
				<span class="stat-value"><span id="span-number-divine-beasts-overview"></span>/<span id="span-number-total-divine-beasts-overview"></span></span>
			</summary>
			<label for="span-number-divine-beasts-incomplete" data-type="divine-beast">
				<span class="map-visibility-toggle dot-divine-beast" data-visibility-types="divine-beast" role="button" tabindex="0" aria-label="Incomplete Divine Beasts map visibility" aria-pressed="false"></span>
				<span class="stat-label-text">Incomplete</span>
				<span class="stat-value"><span id="span-number-divine-beasts-incomplete"></span>/<span id="span-number-total-divine-beasts-incomplete"></span></span>
			</label>
			<label for="span-number-divine-beasts-completed" data-type="divine-beast-completed">
				<span class="map-visibility-toggle dot-divine-beast-completed" data-visibility-types="divine-beast-completed" role="button" tabindex="0" aria-label="Completed Divine Beasts map visibility" aria-pressed="false"></span>
				<span class="stat-label-text">Completed</span>
				<span class="stat-value"><span id="span-number-divine-beasts-completed"></span>/<span id="span-number-total-divine-beasts-completed"></span></span>
			</label>
		</details>
		<details id="miniboss-filter-group" class="stat-collapse-group">
			<summary>
				<span class="filter-summary-main">
					<span class="map-visibility-toggle dot-miniboss" data-visibility-types="hinox hinox-defeated talus talus-defeated molduga molduga-defeated" role="button" tabindex="0" aria-label="Mini-Bosses map visibility" aria-pressed="false"></span>
					<span class="stat-label-text">Mini-Bosses</span>
				</span>
				<span class="stat-value"><span id="span-number-minibosses-defeated"></span>/<span id="span-number-total-minibosses"></span></span>
			</summary>
			<label for="span-number-hinox" data-type="hinox">
				<span class="map-visibility-toggle dot-hinox" data-visibility-types="hinox" role="button" tabindex="0" aria-label="Hinox map visibility" aria-pressed="false"></span>
				<span class="stat-label-text">Hinox</span>
				<span class="stat-value"><span id="span-number-hinox"></span>/<span id="span-number-total-hinox-remaining"></span></span>
			</label>
			<label for="span-number-hinox-defeated" data-type="hinox-defeated">
				<span class="map-visibility-toggle dot-hinox-defeated" data-visibility-types="hinox-defeated" role="button" tabindex="0" aria-label="Defeated Hinox map visibility" aria-pressed="false"></span>
				<span class="stat-label-text">Hinox Defeated</span>
				<span class="stat-value"><span id="span-number-hinox-defeated"></span>/<span id="span-number-total-hinox"></span></span>
			</label>
			<label for="span-number-talus" data-type="talus">
				<span class="map-visibility-toggle dot-talus" data-visibility-types="talus" role="button" tabindex="0" aria-label="Talus map visibility" aria-pressed="false"></span>
				<span class="stat-label-text">Talus</span>
				<span class="stat-value"><span id="span-number-talus"></span>/<span id="span-number-total-talus-remaining"></span></span>
			</label>
			<label for="span-number-talus-defeated" data-type="talus-defeated">
				<span class="map-visibility-toggle dot-talus-defeated" data-visibility-types="talus-defeated" role="button" tabindex="0" aria-label="Defeated Talus map visibility" aria-pressed="false"></span>
				<span class="stat-label-text">Talus Defeated</span>
				<span class="stat-value"><span id="span-number-talus-defeated"></span>/<span id="span-number-total-talus"></span></span>
			</label>
			<label for="span-number-molduga" data-type="molduga">
				<span class="map-visibility-toggle dot-molduga" data-visibility-types="molduga" role="button" tabindex="0" aria-label="Molduga map visibility" aria-pressed="false"></span>
				<span class="stat-label-text">Molduga</span>
				<span class="stat-value"><span id="span-number-molduga"></span>/<span id="span-number-total-molduga-remaining"></span></span>
			</label>
			<label for="span-number-molduga-defeated" data-type="molduga-defeated">
				<span class="map-visibility-toggle dot-molduga-defeated" data-visibility-types="molduga-defeated" role="button" tabindex="0" aria-label="Defeated Molduga map visibility" aria-pressed="false"></span>
				<span class="stat-label-text">Molduga Defeated</span>
				<span class="stat-value"><span id="span-number-molduga-defeated"></span>/<span id="span-number-total-molduga"></span></span>
			</label>
		</details>
	</div>
	<div id="save-slot-section">
		<div class="toolbar-section-title">Save Slot</div>
		<select id="save-slot-select">
			<option value="auto">Auto (most recent)</option>
		</select>
	</div>
	<div id="tracking-panel">
		<div class="toolbar-section-title">Player Position</div>
		<button id="track-player-row" type="button" data-tracking="false">
			<span class="control-title">Auto-follow</span>
			<span class="tracking-state"><span class="tracking-state-dot"></span><span class="tracking-state-text">Off</span></span>
		</button>
		<div class="tracking-inline-controls">
			<button id="player-marker-toggle" type="button" data-type="player-position" data-marker-visible="true" aria-pressed="true">
				<span class="marker-toggle-indicator"></span>
				<span class="marker-toggle-text">Marker</span>
			</button>
			<div id="track-zoom-row">
				<label for="track-zoom-slider" id="track-zoom-label">
					<span>Follow zoom</span>
					<span id="track-zoom-value">15%</span>
				</label>
				<input type="range" id="track-zoom-slider" min="5" max="90" value="15" step="1">
			</div>
		</div>
	</div>
	<div id="services-section">
		<div class="toolbar-section-title">Services<span class="section-toggle-indicator"> ▾</span></div>
		<label data-service="hatago">Stable</label>
		<label data-service="village">Village</label>
		<label data-service="settlement">Settlement</label>
		<label data-service="great_fairy">Great Fairy</label>
		<label data-service="goddess">Goddess Statue</label>
		<label data-service="yadoya">Inn</label>
		<label data-service="shop_yorozu">General Store</label>
		<label data-service="shop_bougu">Armor Shop</label>
		<label data-service="shop_jewel">Jewelry Shop</label>
	</div>
	<div id="player-stats-section">
		<div class="player-stats-title">Player Stats</div>
		<div class="player-stat-row">
			<span class="player-stat-label">Hearts</span>
			<span class="player-stat-value" id="span-stat-hearts">&mdash;</span>
		</div>
		<div class="player-stat-row">
			<span class="player-stat-label">Stamina</span>
			<span class="player-stat-value" id="span-stat-stamina">&mdash;</span>
		</div>
		<div class="player-stat-row">
			<span class="player-stat-label">Playtime</span>
			<span class="player-stat-value" id="span-stat-playtime">&mdash;</span>
		</div>
		<div class="player-stat-row">
			<span class="player-stat-label">Rupees</span>
			<span class="player-stat-value" id="span-stat-rupees">&mdash;</span>
		</div>
		<div class="player-stat-row">
			<span class="player-stat-label">Motorcycle</span>
			<span class="motorcycle-light not-owned" id="stat-motorcycle-light"></span>
		</div>
	</div>
	<div id="server-status">
		<span id="save-timestamp-label">Last Update:</span>
		<div id="timestamp-row">
			<span id="save-timestamp"></span>
			<span id="server-status-dot" class="server-status-dot offline"></span>
		</div>
	</div>
</div>


<!-- THE EDITOR -->
<div id="the-editor" class="wrapper hidden">
	<!-- DEBUG -->
	<div id="debug"></div>

	<div id="map-viewport">
		<div id="zoom-label"></div>
		<div id="map-container">
			<img src='./assets/images/BotW-Map.png'/>
			<svg id="path-svg">
					<defs>
					<marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth" viewBox="0 0 20 20">
						<path d="M0,0 L0,6 L9,3 Z" fill="lime" stroke="green" stroke-width="1" />
					</marker>
					</defs>
				<g id="path-group" fill="none" stroke="#ffffff" stroke-width="3" marker-start="url(#arrow)"></g>
			</svg>
		</div>
	</div>
	
</div>


<script>
(function () {
	window.BotWApi.get('/api/version').then(function (response) {
		if (response && response.ok && response.version) {
			var versionEl = document.getElementById('app-version');
			if (versionEl) {
				versionEl.textContent = ' v' + response.version;
			}
		}
	});
})();

// Mobile sidebar toggle — only relevant under the 900px breakpoint where
// hyrule-hud-theme.css turns the sidebar into an off-canvas drawer.
(function () {
	var btn = document.getElementById('sidebar-toggle-btn');
	if (!btn) return;
	btn.addEventListener('click', function () {
		var open = document.body.classList.toggle('sidebar-open');
		btn.setAttribute('aria-expanded', open ? 'true' : 'false');
	});
})();
</script>

</body>
</html>
